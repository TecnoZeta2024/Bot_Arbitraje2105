[theme]
primaryColor = "#6366f1"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#1e293b"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[deprecation]
showPyplotGlobalUse = false

[logger]
level = "INFO"
messageFormat = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"